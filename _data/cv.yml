  summary: 'Field Robotics Engineer specializing in <span class="nobr">AI-based</span> solutions for low visibility challenges in ground and underwater environments. With nearly three years of <span class="nobr">hands-on</span> embedded firmware and circuit design experience (STM32, ATmega128, OrCAD/Allegro), I now focus on robust pose estimation aimed at achieving <span class="nobr">long-term</span> autonomy for robots. Currently pursuing a Ph.D. at Inha University in the SPARO Lab (expected Aug.&nbsp;2027), I have published in IJRR, IEEE <span class="nobr">T-FR</span>, IEEE <span class="nobr">RA-L</span>, and IEEE Sensors Journal (two <span class="nobr">first-author</span> papers), <span class="nobr">co-authored</span> an ICRA 2026 Best Paper Award finalist, and won 2nd place out of 131 teams in the IROS 2026 IMU Odometry&nbsp;Challenge.'
