  summary: "Field Robotics Engineer specializing in AI-based solutions for low visibility challenges in ground and underwater environments. With nearly three years of hands-on embedded firmware and circuit design experience (STM32, ATmega128, OrCAD/Allegro), I now focus on robust pose estimation aimed at achieving long-term autonomy for robots. Currently pursuing a Ph.D. at Inha University in the SPARO Lab (expected Aug. 2027), I have published in IJRR, IEEE T-FR, IEEE RA-L, and IEEE Sensors Journal (two first-author papers), co-authored an ICRA 2026 Best Paper Award finalist, and won 2nd place out of 131 teams in the IROS 2026 IMU Odometry Challenge."
